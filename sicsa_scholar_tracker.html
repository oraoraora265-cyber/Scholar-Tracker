<script>
const AVATARS = [
  {bg:'#e8f2eb',color:'#2d5a3d'},
  {bg:'#e8eef7',color:'#1e3f6e'},
  {bg:'#fdf3e0',color:'#7a5a20'},
  {bg:'#f0eafa',color:'#4a2d7a'},
  {bg:'#faeaea',color:'#7a2020'},
  {bg:'#e8f5f5',color:'#1e5a5a'},
];

const STATUS_STYLE = {
  'Employed':        {bg:'#e8f2eb', color:'#2d5a3d'},
  'Self-employed':   {bg:'#fdf3e0', color:'#7a5a20'},
  'Graduate school': {bg:'#f0eafa', color:'#4a2d7a'},
  'Unemployed':      {bg:'#f0f0ee', color:'#5a5a52'},
  'Still studying':  {bg:'#e8eef7', color:'#1e3f6e'},
};

const SAMPLE_DATA = [
  {id:1, first:'Maria', last:'Santos', batch:1, course:'BS Nursing', job:'Registered Nurse, PGH', email:'maria@email.com', phone:'+63 912 111 2222', status:'Employed', gender:'Female', birthday:'1998-03-14', address:'Malaybalay City, Bukidnon', gradYear:2020, batchYear:2016},
  {id:2, first:'Jose', last:'Reyes', batch:2, course:'BS Computer Science', job:'Web Developer, Accenture', email:'jose@email.com', phone:'+63 917 333 4444', status:'Employed', gender:'Male', birthday:'1997-07-22', address:'Valencia City, Bukidnon', gradYear:2019, batchYear:2015},
  {id:3, first:'Ana', last:'Garcia', batch:3, course:'BA Communication', job:'Content Strategist, Freelance', email:'ana@email.com', phone:'', status:'Self-employed', gender:'Female', birthday:'1999-11-05', address:'Davao City', gradYear:2021, batchYear:2017},
  {id:4, first:'Carlo', last:'Bautista', batch:4, course:'BS Business Administration', job:'', email:'carlo@email.com', phone:'', status:'Graduate school', gender:'Male', birthday:'2000-01-30', address:'Cagayan de Oro City', gradYear:2022, batchYear:2018},
];

function loadData(){
  try {
    const saved = localStorage.getItem('alumni_db');
    return saved ? JSON.parse(saved) : SAMPLE_DATA;
  } catch(e){ return SAMPLE_DATA; }
}

function saveData(){
  try { localStorage.setItem('alumni_db', JSON.stringify(alumni)); } catch(e){}
}

let alumni = loadData();
let editId = null;

function initials(f, l){ return ((f[0]||'')+(l[0]||'')).toUpperCase(); }
function colorFor(name){ let s=0; for(let c of name) s+=c.charCodeAt(0); return AVATARS[s%AVATARS.length]; }
function fullName(a){ return a.first + ' ' + a.last; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const yr = document.getElementById('filter-year').value;
  const st = document.getElementById('filter-status').value;

  let filtered = alumni.filter(a => {
    const name = fullName(a).toLowerCase();
    const match = name.includes(q) || String(a.batch).includes(q) || a.course.toLowerCase().includes(q) || a.job.toLowerCase().includes(q) || a.email.toLowerCase().includes(q) || (a.address||'').toLowerCase().includes(q) || String(a.gradYear||'').includes(q) || String(a.batchYear||'').includes(q);
    return match && (!yr || String(a.batch)===yr) && (!st || a.status===st);
  });

  // Update batch filter
  const batches = [...new Set(alumni.map(a=>a.batch))].sort((a,b)=>a-b);
  const sel = document.getElementById('filter-year');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All batches</option>' + batches.map(b=>`<option value="${b}"${cur==b?' selected':''}>Batch ${b}</option>`).join('');

  // Stats
  const employed = alumni.filter(a=>a.status==='Employed').length;
  const studying = alumni.filter(a=>a.status==='Still studying').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Total scholars</div><div class="stat-value">${alumni.length}</div></div>
    <div class="stat"><div class="stat-label">Employed</div><div class="stat-value">${employed}</div></div>
    <div class="stat"><div class="stat-label">Still studying</div><div class="stat-value">${studying}</div></div>
    <div class="stat"><div class="stat-label">Batches</div><div class="stat-value">${batches.length}</div></div>
    <div class="stat"><div class="stat-label">Showing</div><div class="stat-value">${filtered.length}</div></div>
  `;

  // List
  const list = document.getElementById('list');
  if(!filtered.length){
    list.innerHTML = '<div class="empty">No alumni found. Try a different search or filter.</div>';
    return;
  }

  list.innerHTML = filtered.map(a => {
    const c = colorFor(fullName(a));
    const s = STATUS_STYLE[a.status] || STATUS_STYLE['Unemployed'];
    const jobText = a.job ? ' &middot; ' + a.job : '';
    return `<div class="alumni-card">
      <div class="avatar" style="background:${c.bg};color:${c.color}">${initials(a.first, a.last)}</div>
      <div class="info">
        <div class="name">${fullName(a)}</div>
        <div class="meta">Batch ${a.batch} &middot; ${a.course}${jobText}</div>
        <div class="meta">${[a.gender, a.birthday ? 'Born '+a.birthday : '', a.address].filter(Boolean).join(' · ')}</div>
        <div class="meta">${[a.gradYear ? 'Graduated '+a.gradYear : '', a.batchYear ? 'Scholar Batch '+a.batchYear : ''].filter(Boolean).join(' · ')}</div>
      </div>
      <span class="badge" style="background:${s.bg};color:${s.color}">${a.status}</span>
      <div class="actions">
        <button class="icon-btn" onclick="openModal(${a.id})" title="Edit">✏️</button>
        <button class="icon-btn" onclick="deleteAlumni(${a.id})" title="Delete">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function openModal(id=null){
  editId = id;
  document.getElementById('modal-title').textContent = id ? 'Edit alumni' : 'Add alumni';
  if(id){
    const a = alumni.find(x=>x.id===id);
    document.getElementById('f-first').value = a.first;
    document.getElementById('f-last').value = a.last;
    document.getElementById('f-batch').value = a.batch;
    document.getElementById('f-course').value = a.course;
    document.getElementById('f-job').value = a.job;
    document.getElementById('f-email').value = a.email;
    document.getElementById('f-phone').value = a.phone||'';
    document.getElementById('f-status').value = a.status;
    document.getElementById('f-batch').value = a.batch;
    document.getElementById('f-gender').value = a.gender||'';
    document.getElementById('f-birthday').value = a.birthday||'';
    document.getElementById('f-address').value = a.address||'';
    document.getElementById('f-gradyear').value = a.gradYear||'';
    document.getElementById('f-batchyear').value = a.batchYear||'';
  } else {
    ['f-first','f-last','f-course','f-job','f-email','f-phone','f-address','f-gradyear','f-batchyear'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-batch').value = '';
    document.getElementById('f-status').value = 'Employed';
    document.getElementById('f-gender').value = '';
    document.getElementById('f-birthday').value = '';
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); }

function deleteAlumni(id){
  if(!confirm('Delete this alumni record?')) return;
  alumni = alumni.filter(a=>a.id!==id);
  saveData();
  render();
  showToast('Alumni deleted');
}

function saveAlumni(){
  const first = document.getElementById('f-first').value.trim();
  const last = document.getElementById('f-last').value.trim();
  const batch = parseInt(document.getElementById('f-batch').value);
  if(!first || !last){ alert('First and last name are required.'); return; }
  if(!batch || batch < 1){ alert('Please enter a valid batch number (e.g. 1, 2, 3).'); return; }
  const entry = {
    id: editId || Date.now(),
    first, last, batch,
    course: document.getElementById('f-course').value.trim(),
    job: document.getElementById('f-job').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    status: document.getElementById('f-status').value,
    gender: document.getElementById('f-gender').value,
    birthday: document.getElementById('f-birthday').value,
    address: document.getElementById('f-address').value.trim(),
    gradYear: parseInt(document.getElementById('f-gradyear').value)||'',
    batchYear: parseInt(document.getElementById('f-batchyear').value)||'',
  };
  if(editId){ alumni = alumni.map(a=>a.id===editId?entry:a); }
  else { alumni.push(entry); }
  saveData();
  closeModal();
  render();
  showToast(editId ? 'Alumni updated' : 'Alumni added');
}

function exportCSV(){
  if(!alumni.length){ alert('No scholar records to export.'); return; }
  const headers = ['First Name','Last Name','Batch No.','Scholarship Batch Year','Year Graduated','Course / Degree','Current Job / Company','Status','Gender','Birthday','Home Address','Email','Phone'];
  const escape = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows = alumni.map(a => [
    a.first, a.last, a.batch, a.batchYear||'', a.gradYear||'',
    a.course, a.job, a.status, a.gender||'', a.birthday||'',
    a.address||'', a.email, a.phone||''
  ].map(escape).join(','));
  // UTF-8 BOM ensures Excel opens with correct encoding and alignment
  const BOM = '\uFEFF';
  const csv = BOM + [headers.map(escape).join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'SICSA_Scholar_Tracker.csv';
  link.click();
  URL.revokeObjectURL(url);
  showToast('CSV exported!');
}

// Close modal on background click
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});

render();
</script>
</body>
</html>
